name: release

# Tagged releases (v*), built and published via GoReleaser + .goreleaser.yml.
# Unlike onctl's own goreleaser.yml, this runs on a plain GitHub-hosted
# runner and needs no extra secrets -- there's no code-signing/
# notarization/homebrew-tap step here yet (see .goreleaser.yml's own
# comment). The default GITHUB_TOKEN is enough to publish the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

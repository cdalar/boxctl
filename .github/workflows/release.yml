name: release

# Tagged releases (v*), built and published via GoReleaser + .goreleaser.yml.
# Mirrors onctl's own goreleaser.yml, minus macOS for now: Linux and
# Windows binaries, GPG-signed checksums, published to this repo's
# Releases page with the default GITHUB_TOKEN. Runs on the onctl-4 runner
# like the rest of this repo's workflows.
#
# The macOS parts (self-hosted Mac runner, quill install, Apple
# signing/notarization env, GORELEASER_GH_TOKEN for the Homebrew cask) are
# kept commented out below and in .goreleaser.yml, ready to re-enable
# once this repo has the Apple secrets and a Mac runner.
#
# Needs one secret: GPG_PRIVATE_KEY (the same key onctl signs with).
# To dry-run against an existing tag without publishing, see
# release-self-hosted-test.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: onctl-4
    # runs-on: [self-hosted, macOS, ARM64]   # macOS: needed for quill notarization
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: false
      - name: Import GPG Key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --no-tty --batch
          gpg --list-secret-keys
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      # macOS: quill signs and notarizes the darwin binaries.
      # - name: Install quill
      #   run: |
      #     curl -sSfL https://get.anchore.io/quill | sh -s -- -b "$RUNNER_TEMP/bin"
      #     echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # - name: Verify quill
      #   run: quill version
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --timeout 120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS/Homebrew: a PAT that can also write to cdalar/homebrew-tap.
          # GITHUB_TOKEN: ${{ secrets.GORELEASER_GH_TOKEN }}
          # QUILL_SIGN_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          # QUILL_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          # QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          # QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          # QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}

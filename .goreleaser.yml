version: 2
project_name: boxctl

# Real tagged releases (triggered by .github/workflows/release.yml on a
# `v*` tag push). Mirrors onctl's own .goreleaser.yml: GPG-signed
# checksums, Apple-signed+notarized macOS binaries (quill, run on the
# self-hosted macOS runner), and a Homebrew cask pushed to
# cdalar/homebrew-tap. The unsigned per-push edge build is
# .goreleaser.edge.yml, not this file.

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

before:
  hooks:
    - go mod tidy

builds:
  - binary: boxctl
    id: boxctl-macos
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w -s -X 'github.com/cdalar/boxctl/cmd.Version=v{{.Version}}-{{.ShortCommit}}'
    hooks:
      post:
        # --dry-run/--ad-hoc on snapshots so `goreleaser release --snapshot`
        # works locally without Apple credentials.
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv
          env:
            - QUILL_LOG_FILE=/tmp/quill-{{ .Target }}.log

  - binary: boxctl
    id: boxctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -w -s -X 'github.com/cdalar/boxctl/cmd.Version=v{{.Version}}-{{.ShortCommit}}'

archives:
  - id: repl
    name_template: "{{ .ProjectName }}-{{.Os}}-{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: cdalar
    name: boxctl
  prerelease: auto

homebrew_casks:
  - repository:
      owner: cdalar
      name: homebrew-tap
    description: "Command-line client for boxctl.io -- manage your Firecracker microVMs"
    homepage: "https://boxctl.io"
